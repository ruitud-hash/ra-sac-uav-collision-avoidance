env_config: configs/env_tiny.yaml

seed: 8107
device: auto

training:
  total_steps: 30000
  start_steps: 3000
  update_after: 1000
  update_every: 1
  batch_size: 256
  replay_size: 200000
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  hidden_sizes: [256, 256]
  embed_dim: 128
  eval_interval_steps: 3000
  eval_episodes: 10
  checkpoint_interval_steps: 10000

output:
  directory: outputs/train_sac_attention_tiny
