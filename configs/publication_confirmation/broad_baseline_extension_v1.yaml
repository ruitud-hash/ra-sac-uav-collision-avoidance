    environments: [medium_id, disturbance_ood, behavior_ood, composition_ood, combined_ood]
    cells: 125
  five_method_deployment:
    methods: [RA-SAC-v3.2-c, SAC-Attention-v3, SAC-MLP, TD3-MLP, PPO-MLP]
    environments: [medium_id, combined_ood]
    modes: [policy_only, full_shield]
    cells: 100
  existing_ra_sac_and_sac_attention_cells_rerun: false
  new_cells: 105
  new_episodes: 21000

scientific_configuration:
  episodes_per_cell: 200
  evaluation_seed_start: 149000
  evaluation_seed_end: 149199
  paired_scenarios_across_all_methods: true
  checkpoint_rule: fixed_nominal_training_budget
  checkpoint_steps:
    SAC-MLP: 1000000
    TD3-MLP: 1000000
    PPO-MLP: 1003520
  ppo_step_rationale: first completed rollout boundary at or above the nominal 1M budget
  shield_mode_for_batch5: full_shield
  shield_parameters_retuning_allowed: false
  checkpoint_or_algorithm_changes_allowed: false
  environment_changes_allowed: false

analysis_rules:
  statistical_unit: paired_training_seed
  episode_pseudoreplication_forbidden: true
  report: [mean, sample_sd, seedwise_result, worst_seed, OOD_minus_medium_id]
  significance_language_primary: false
  deep_paired_mechanism_diagnostics_restricted_to: [RA-SAC-v3.2-c, SAC-Attention-v3]
  broad_baseline_role: performance_hierarchy_and_deployment_context
  first_analysis_output_overwrite: forbidden

metrics:
  performance: [success_rate, dynamic_collision_rate, static_collision_rate, collision_rate, safety_failure_rate, timeout_rate, out_of_bounds_rate, avg_reward, avg_fhp]
  intervention: [modified_episode_rate, SIF, SIR, SCM, p95_interventions_per_episode]
  shield_effect: full_shield_minus_policy_only

claim_guardrails:
  superiority_claim_allowed: false
  causal_mechanism_claim_for_breadth_baselines_allowed: false
  full_shield_source_attribution_available: false
  certified_realtime_claim_allowed: false
  baseline_results_must_not_trigger_algorithm_or_shield_retuning: true

