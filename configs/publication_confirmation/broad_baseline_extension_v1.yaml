  training_seeds: [18207, 28207, 38207, 48207, 58207]
  environments: [medium_id, combined_ood]
  mode: full_shield
  cells: 30
  episodes: 6000
  original_protocol_cells: 15
  post_opening_extension_cells: 15

complete_publication_matrices_after_completion:
